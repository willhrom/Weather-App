name: Build Android app

on:
  push:
    branches: [main]
    paths: ["web/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest app page
        run: |
          mkdir -p android/app/src/main/assets/web
          sed "s#__REPO__#${{ github.repository }}#" web/index.html > android/app/src/main/assets/web/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        run: gradle -p android assembleRelease --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk weather.apk
      # Always published to the same "android" release, so the download link never changes.
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Android weather app (always the newest)
          body: "Install on your phone by opening: https://github.com/${{ github.repository }}/releases/download/android/weather.apk"
          files: weather.apk
          overwrite_files: true
          make_latest: false
