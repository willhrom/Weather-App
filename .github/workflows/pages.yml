name: Publish app page (Cloudflare Pages)

# Every change to web/ goes live in the app the next time it opens — no reinstall.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the page
        run: |
          mkdir -p dist
          sed -e "s#__REPO__#${{ github.repository }}#" -e "s#__BUILD__#${{ github.run_number }}#" web/index.html > dist/index.html
          printf '/*\n  Cache-Control: no-cache\n' > dist/_headers
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create willhrom-weather --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name=willhrom-weather --branch=main --commit-dirty=true
