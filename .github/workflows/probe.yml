name: Pacific probe
on: { push: { branches: [pacific] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pygrib==2.1.6 numpy scipy pillow requests
      - run: |
          set -o pipefail
          FORCE=1 python -u gfs/build_gfs.py dist 2>&1 | tee build.log
          printf '/*\n  Access-Control-Allow-Origin: *\n  Cache-Control: public, max-age=600\n  X-Content-Type-Options: nosniff\n/gfs/manifest.json\n  Cache-Control: no-cache\n' > dist/_headers
          printf 'not found' > dist/404.html
          du -sh dist; find dist -name '*.png' | wc -l
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.157.0 pages project create willhrom-weather-gfs --production-branch=main || true
          npx --yes wrangler@4.157.0 pages deploy dist --project-name=willhrom-weather-gfs --branch=main --commit-dirty=true
          sleep 20; curl -s https://willhrom-weather-gfs.pages.dev/gfs/manifest.json > man_live.txt; curl -sI https://willhrom-weather-gfs.pages.dev/gfs/f000/5/3/12.png > hdr_live.txt; curl -sI https://willhrom-weather-gfs.pages.dev/gfs/f000/9/3/12.png >> hdr_live.txt
      - if: always()
        run: |
          mkdir out && cp build.log man_live.txt hdr_live.txt out/ 2>/dev/null; cp -r dist/gfs out/ 2>/dev/null; cd out && python3 ../.github/pac_probe.py || true
          git init -q && git checkout -q -b gtg-debug && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm p && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gtg-debug
