name: Ocean rain (GFS model)

# Radar stops a couple hundred km off the coast. Offshore, the app shows NOAA's GFS model
# reflectivity instead, in the same colours. GFS runs every 6 h; this picks up each run
# about 4.5 h after it starts (when NOMADS has it) and skips if it's already published.
on:
  schedule:
    - cron: "35 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this cycle is already published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["gfs/**", ".github/workflows/gfs.yml"]

permissions:
  contents: read

concurrency:
  group: gfs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install decoder
        run: pip install --quiet pygrib==2.1.6 numpy scipy pillow requests
      - name: Build tiles from the newest GFS run
        id: build
        env:
          PREV_MANIFEST_URL: https://willhrom-weather-gfs.pages.dev/gfs/manifest.json
          FORCE: ${{ (github.event_name == 'push' || inputs.force) && '1' || '0' }}
        run: |
          set -o pipefail
          python -u gfs/build_gfs.py dist 2>&1 | tee build.log
      - name: Headers
        if: steps.build.outputs.skip != '1'
        run: |
          printf '/*\n  Access-Control-Allow-Origin: *\n  Cache-Control: public, max-age=600\n  X-Content-Type-Options: nosniff\n/gfs/manifest.json\n  Cache-Control: no-cache\n' > dist/_headers
          printf 'not found' > dist/404.html
          du -sh dist; find dist -name '*.png' | wc -l
      - uses: actions/setup-node@v4
        if: steps.build.outputs.skip != '1'
        with:
          node-version: "22"
      - name: Publish to Cloudflare Pages
        if: steps.build.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.157.0 pages project create willhrom-weather-gfs --production-branch=main || true
          npx --yes wrangler@4.157.0 pages deploy dist --project-name=willhrom-weather-gfs --branch=main --commit-dirty=true
