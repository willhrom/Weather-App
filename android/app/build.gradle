plugins { id 'com.android.application' }

def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
  namespace 'com.weather.app'
  compileSdk 34
  defaultConfig {
    applicationId 'com.weather.app'
    minSdk 24
    targetSdk 34
    versionCode run
    versionName "1.0.${run}"
  }
  // The signing key lives in GitHub secrets, never in the repo. The build workflow writes it
  // to a temporary file and passes its location and password in environment variables.
  signingConfigs {
    release {
      def ks = System.getenv("ANDROID_KEYSTORE_PATH")
      if (ks) {
        storeFile file(ks)
        storeType "pkcs12"
        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
        keyAlias "weather"
        keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
      }
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
  // Widget rendering check (gradle testReleaseUnitTest): draws every widget to PNGs on the build machine.
  testOptions { unitTests { includeAndroidResources = true; all { systemProperty 'robolectric.graphicsMode', 'NATIVE'; systemProperty 'shots.dir', System.getenv('SHOTS_DIR') ?: '' } } }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.13'
}
